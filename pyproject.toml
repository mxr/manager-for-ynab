[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools"]

[dependency-groups]
dev = [
  "covdefaults>=2.1.0",
  "coverage",
  "pytest",
  "pytest-asyncio",
]

[project]
authors = [{name = "Max R", email = "mxr@users.noreply.github.com"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "Babel",
  "aiohttp",
  "aiosqlite",
  "asyncio-for-ynab~=1.86.0",
  "prompt-toolkit",
  "pyecharts",
  "rich>=10",
  "sqlite-export-for-ynab~=2.9.6",
]
description = "Manager for YNAB"
keywords = ["ynab", "budget", "plan", "cli", "reconcile", "automation", "manager"]
license = "MIT"
license-files = ["LICENSE"]
name = "manager_for_ynab"
readme = "README.md"
requires-python = ">=3.14"
version = "1.9.4"

[project.scripts]
manager-for-ynab = "manager_for_ynab._main:main"

[project.urls]
Homepage = "https://github.com/mxr/manager-for-ynab"

[tool.coverage.run]
plugins = ["covdefaults"]

[tool.mypy]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
disallow_untyped_defs = false
module = "testing.*"

[[tool.mypy.overrides]]
disallow_untyped_defs = false
module = "tests.*"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
asyncio_default_fixture_loop_scope = "function"
markers = ["token_env(value): override the YNAB access token env var for this test"]
python_files = ["test.py"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
extend-select = [
  "A",  # see flake8-builtins
  "B",  # see flake8-bugbear
  "C4",  # see flake8-comprehension
  "I",  # sort imports
  "S",  # see flake8-bandit
  "SIM",  # see flake8-simplify
  "TC",  # see flake8-type-checking
  "UP",  # see pyupgrade
]

[tool.ruff.lint.isort]
force-single-line = true

[tool.setuptools.package-data]
"*" = ["py.typed"]
"manager_for_ynab.auto_approve" = ["*.sql"]
"manager_for_ynab.pending_income" = ["*.sql"]
"manager_for_ynab.sankey" = ["*.sql"]

[tool.setuptools.packages]
find = {}

[tool.sqlfluff.layout.type.comma]
line_position = "leading"
spacing_before = "touch"

[tool.sqlfluff.layout.type.from_clause]
keyword_line_position = "leading"

[tool.sqlfluff.layout.type.when_clause]
keyword_line_position = "leading"

[tool.sqlfluff.rules.capitalisation.functions]
extended_capitalisation_policy = 'upper'

[tool.sqlfluff.rules.capitalisation.identifiers]
extended_capitalisation_policy = 'lower'

[tool.sqlfluff.rules.capitalisation.keywords]
capitalisation_policy = 'upper'

[tool.sqlfluff.rules.capitalisation.literals]
capitalisation_policy = 'upper'

[tool.sqlfluff.rules.convention.not_equal]
preferred_not_equal_style = "c_style"

[tool.sqlfluff.rules.convention.terminator]
multiline_newline = true
require_final_semicolon = true

[tool.sqlfluff.rules.references.quoting]
prefer_quoted_keywords = true

[tool.tox]
env_list = ["py", "pypy3", "pre-commit"]

[tool.tox.env.pre-commit]
commands = [["pre-commit", "run", "--all-files", "--show-diff-on-failure"]]
deps = ["pre-commit-uv"]
skip_install = true

[tool.tox.env_run_base]
commands = [
  ["coverage", "erase"],
  ["coverage", "run", "-m", "pytest", "{posargs:tests}"],
  ["coverage", "report"],
]
dependency_groups = ["dev"]

[tool.ty.rules]
all = "error"
